<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13">
        <animate attributeName="stop-color" values="#070a13;#0b1120;#070a13" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035">
        <animate attributeName="stop-color" values="#1e1035;#131b2e;#1e1035" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="65%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Effect Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tech Circuit / Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Dynamic Pulse Keyframes -->
    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 600; opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatUp {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatDown {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      .circuit-flow {
        stroke-dasharray: 120 180;
        animation: pulseBeam 6s linear infinite;
      }
      .float-badge-1 {
        animation: floatUp 5s ease-in-out infinite;
      }
      .float-badge-2 {
        animation: floatDown 6s ease-in-out infinite;
      }
      .float-badge-3 {
        animation: floatUp 7s ease-in-out infinite;
      }
      .pulse-ambient {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#gridPattern)" />

  <!-- 2. Ambient Pulsing Glow Orbs in Background -->
  <circle class="pulse-ambient" cx="220" cy="90" r="110" fill="#38bdf8" fill-opacity="0.12" filter="url(#softGlow)" />
  <circle class="pulse-ambient" cx="980" cy="110" r="130" fill="#a855f7" fill-opacity="0.14" filter="url(#softGlow)" />
  <circle class="pulse-ambient" cx="600" cy="280" r="140" fill="#6366f1" fill-opacity="0.09" filter="url(#softGlow)" />

  <!-- 3. Animated Circuit Lines & Data Streams (Background/Midground) -->
  <g fill="none" stroke-width="1.8">
    <path class="circuit-flow" stroke="url(#flowGrad)" d="M 50 80 Q 250 20 450 80 T 850 80 T 1150 80" />
    <path class="circuit-flow" stroke="url(#flowGrad)" d="M 50 300 Q 300 350 600 300 T 1150 300" style="animation-duration: 8s;" />
    <path class="circuit-flow" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" d="M 120 30 L 280 30 L 320 80 L 520 80" />
    <path class="circuit-flow" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" d="M 1080 340 L 920 340 L 880 290 L 680 290" />
  </g>

  <!-- 4. Subtle Floating Architecture Badges (Below Main Text) -->
  <g class="float-badge-1" transform="translate(110, 275)">
    <rect width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" filter="url(#badgeGlow)" />
    <circle cx="20" cy="18" r="5" fill="#38bdf8" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">⚡ MACH ARCHITECTURE</text>
  </g>

  <g class="float-badge-2" transform="translate(360, 290)">
    <rect width="210" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" filter="url(#badgeGlow)" />
    <circle cx="20" cy="18" r="5" fill="#818cf8" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">🧩 COMPOSABLE COMMERCE</text>
  </g>

  <g class="float-badge-3" transform="translate(640, 290)">
    <rect width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2" filter="url(#badgeGlow)" />
    <circle cx="20" cy="18" r="5" fill="#c084fc" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">🔌 HEADLESS &amp; API-FIRST</text>
  </g>

  <g class="float-badge-1" transform="translate(900, 275)">
    <rect width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="#f43f5e" stroke-width="1.2" filter="url(#badgeGlow)" />
    <circle cx="20" cy="18" r="5" fill="#f43f5e" />
    <text x="35" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.5">🌐 B2B &amp; B2C AT SCALE</text>
  </g>

  <!-- 5. Decorative Top Corner Accent Tags -->
  <g transform="translate(40, 35)">
    <text fill="#64748b" font-family="monospace" font-size="12" letter-spacing="1.5">&lt;ENTERPRISE_ECOMMERCE_INDEX /&gt;</text>
  </g>
  <g transform="translate(1030, 35)">
    <text fill="#64748b" font-family="monospace" font-size="12" letter-spacing="1.5">v2.0 • 2026 EDITION</text>
  </g>

  <!-- 6. FOREGROUND: Title & Subtitle (Always in crystal-clear foreground) -->
  <g text-anchor="middle">
    <!-- Top Micro Tagline -->
    <text x="600" y="95" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3" text-transform="uppercase">
      CURATED ENTERPRISE TECH DIRECTORY
    </text>

    <!-- Main Title with Gradient and Drop Shadow -->
    <text x="600" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Enterprise E-Commerce Platform
    </text>

    <!-- Subtitle Description -->
    <text x="600" y="200" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" letter-spacing="0.2">
      Production-Grade Composable Engines, Headless Cart APIs, Open-Source Solutions &amp; Omnichannel Platforms
    </text>

    <!-- High-Impact Value Metric Pills -->
    <text x="600" y="236" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      ⚡ Microservices • ☁️ Multi-Tenant Cloud • 🔒 SOC-2/PCI-DSS Ready • 🌍 Global Multi-Currency &amp; Localization
    </text>
  </g>
</svg>